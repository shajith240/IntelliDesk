# Runs email intake every 10 minutes. Vercel's free plan only allows a daily
# cron, so the schedule lives here (GitHub Actions is free for public repos).
#
# Repository secrets required (Settings -> Secrets and variables -> Actions):
#   APP_URL      e.g. https://your-app.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET env var on Vercel
name: Poll support mailboxes

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: poll-mailboxes
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the intake endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL or CRON_SECRET is not configured; skipping."
            exit 0
          fi
          status=$(curl --silent --show-error --max-time 90 --output response.json --write-out "%{http_code}" \
            --request POST --header "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/emails/poll")
          echo "HTTP $status"
          cat response.json; echo
          test "$status" = "200"
